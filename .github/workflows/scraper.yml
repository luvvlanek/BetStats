name: Scraper - BetStats

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scrape-ekstraklasa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Ekstraklasa scraper
        working-directory: ./ekstraklasa
        run: python mainScr.py

      - name: Commit Ekstraklasa
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data_ekstra.json live_ekstra.json finished_ekstra.json 2>/dev/null || true
          git add ekstraklasa/*.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🤖 Auto: Ekstraklasa + 1. Liga"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..." && sleep 5
          done

  scrape-bundesliga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scrape-ekstraklasa

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Bundesliga scraper
        working-directory: ./bundesliga
        run: python mainScr.py

      - name: Commit Bundesliga
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data_int.json live_int.json finished_int.json 2>/dev/null || true
          git add bundesliga/*.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🤖 Auto: Bundesliga + La Liga"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..." && sleep 5
          done

  scrape-world:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scrape-bundesliga

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run World scraper
        working-directory: ./world
        run: python mainScr.py

      - name: Commit World
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data_world.json live_world.json finished_world.json 2>/dev/null || true
          git add world/*.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🤖 Auto: LM + LE + Liga Konferencji"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..." && sleep 5
          done

  scrape-siatkowka:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: scrape-world

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Pull latest
        run: git pull

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run Siatkowka scraper
        working-directory: ./siatkowka
        run: python mainScr.py

      - name: Commit Siatkowka
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data_volley_pl.json live_volley_pl.json finished_volley_pl.json 2>/dev/null || true
          git add siatkowka/*.json 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "🤖 Auto: Siatkówka PL"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Retry $i..." && sleep 5
          done